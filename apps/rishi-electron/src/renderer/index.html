<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rishi</title>
    <!--
      Pre-resolve the worker host so the first authenticated API call
      doesn't pay the DNS round-trip. Sign-in itself happens in the user's
      default browser via `rishi://` deep links, so we don't need to warm
      any third-party auth domains from the renderer.
    -->
    <link rel="dns-prefetch" href="https://api.fidexa.org" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' local-file:;
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com blob:;
        style-src 'self' 'unsafe-inline' blob:;
        img-src 'self' data: blob: local-file: https://*.r2.dev;
        connect-src 'self' ws://localhost:* http://localhost:* local-file: https://cdnjs.cloudflare.com https://api.fidexa.org https://api.openai.com wss://api.openai.com;
        worker-src 'self' blob: https://cdnjs.cloudflare.com;
        media-src 'self' blob: data: local-file:;
        font-src 'self' data:;
        frame-src 'self' local-file: blob: about:;
        child-src 'self' blob: about:;"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
