appId: org.fidexa.rishi
productName: Rishi
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
protocols:
  - name: Rishi Electron
    schemes:
      - rishi-electron
asarUnpack:
  - resources/**
  - node_modules/better-sqlite3/**
  - node_modules/hnswlib-node/**
  - node_modules/onnxruntime-node/**
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSMicrophoneUsageDescription: "Rishi needs microphone access for voice chat features."
  notarize: true
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
win:
  azureSignOptions:
    endpoint: https://eus.codesigning.azure.net
    codeSigningAccountName: RishiSigning
    certificateProfileName: RishiPublicTrust
    publisherName: Fidexa
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: "Rishi-${version}-setup.${ext}"
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
npmRebuild: true
publish:
  provider: github
  owner: matovu-farid
  repo: rishi-monorepo
