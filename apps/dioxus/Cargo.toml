[package]
name = "rishi-dioxus"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rishi-dioxus"
path = "src/main.rs"

[lib]
name = "rishi_dioxus"
path = "src/lib.rs"

[dependencies]
dioxus = { version = "0.6", features = ["desktop", "router"] }
diesel = { version = "2", features = ["sqlite", "r2d2"] }
diesel_migrations = "2"
r2d2 = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
tracing = "0.1"

# File Formats
pdfium-render = "0.9"
epub = "2.1"
mobi = "0.8"
scraper = "0.26"
image = "0.25"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
