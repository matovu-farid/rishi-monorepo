name: Release Desktop

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # Needed for creating releases

jobs:
  verify-main:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure tag points to a commit on main
        env:
          TAG_REF: ${{ github.ref }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          TAG_COMMIT=$(git rev-list -n 1 "$TAG_REF")
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "::error::Tag $TAG_NAME does not point to a commit on main. Releases must be created from main."
            exit 1
          fi

  release:
    needs: verify-main
    permissions:
      contents: write
    name: Build & Release (${{ matrix.platform }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
            rust_targets: ''
          - platform: windows-latest
            args: ''
            rust_targets: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2  # 0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable  # 29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2  # 42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          workspaces: apps/main/src-tauri

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libclang-dev clang libsqlite3-dev

      - name: Import Apple Developer Certificate
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain
          rm certificate.p12

      - name: Install Azure Trusted Signing CLI (Windows)
        if: matrix.platform == 'windows-latest'
        run: cargo install trusted-signing-cli --version 0.9.0

      - name: Install tauri-typegen
        run: cargo install tauri-typegen --version 0.3.2

      - name: Install shared package dependencies
        run: cd packages/shared && bun install

      - name: Install frontend dependencies
        run: cd apps/main && bun install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0.6  # 4d285e1880165511a32eafd8616624dd75d05513
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/main
          tagName: ${{ github.ref_name }}
          releaseName: 'Rishi ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          includeUpdaterJson: true

      - name: Upload Windows installer to S3 (Windows)
        if: matrix.platform == 'windows-latest'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $exe = "apps/main/src-tauri/target/release/bundle/nsis/rishi_${version}_x64-setup.exe"
          $tag = "${{ github.ref_name }}"
          aws s3 cp $exe "s3://rishi-tauri/releases/${tag}/rishi_${version}_x64-setup.exe" --content-type "application/octet-stream" --acl public-read
          echo "S3_PACKAGE_URL=https://rishi-tauri.s3.us-east-1.amazonaws.com/releases/${tag}/rishi_${version}_x64-setup.exe" >> $env:GITHUB_OUTPUT
        id: s3_upload
        shell: pwsh

      - name: Cleanup keychain
        if: always() && matrix.platform == 'macos-latest'
        run: |
          security default-keychain -s login.keychain-db
          security delete-keychain build.keychain || true

  update-ms-store:
    name: Update Microsoft Store
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Configure Store credentials
        uses: microsoft/store-submission@v1  # 1dbdf522fd5e751104cf3b325073b47f6f2fc09c
        with:
          command: configure
          type: win32
          seller-id: ${{ secrets.MS_STORE_SELLER_ID }}
          product-id: ${{ secrets.MS_STORE_PRODUCT_ID }}
          tenant-id: ${{ secrets.MS_STORE_TENANT_ID }}
          client-id: ${{ secrets.MS_STORE_CLIENT_ID }}
          client-secret: ${{ secrets.MS_STORE_CLIENT_SECRET }}

      - name: Compute version
        id: version
        run: echo "clean=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Update package
        uses: microsoft/store-submission@v1  # 1dbdf522fd5e751104cf3b325073b47f6f2fc09c
        with:
          command: update
          product-update: '{"packages":[{"packageUrl":"https://rishi-tauri.s3.us-east-1.amazonaws.com/releases/${{ github.ref_name }}/rishi_${{ steps.version.outputs.clean }}_x64-setup.exe","languages":["en"],"architectures":["X64"],"installerParameters":"/S","isSilentInstall":true}]}'

      - name: Publish submission
        uses: microsoft/store-submission@v1  # 1dbdf522fd5e751104cf3b325073b47f6f2fc09c
        with:
          command: publish

  publish-winget:
    name: Publish to Winget
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@7bd472be23763def6e16bd06cc8b1cdfab0e2fd5  # main
        with:
          identifier: Fidexa.RishiReader
          token: ${{ secrets.WINGET_TOKEN }}
