apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.rishipdfextractor'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

android {
  namespace 'expo.modules.rishipdfextractor'
  compileSdk safeExtGet("compileSdkVersion", 35)
  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 35)
  }
  buildFeatures { buildConfig false }
  testOptions { unitTests.returnDefaultValues = true }
}

repositories {
  google()
  mavenCentral()
  maven { url 'https://jitpack.io' }
}

dependencies {
  implementation 'com.github.barteksc:pdfium-android:1.9.0'
  testImplementation 'junit:junit:4.13.2'
}

// Lock to a single Pdfium version — react-native-pdf transitively
// depends on this same library and version drift causes runtime
// linker errors. The force below is harmless if versions match.
configurations.all {
  resolutionStrategy {
    force 'com.github.barteksc:pdfium-android:1.9.0'
  }
}
