name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - 'workers/worker/**'
      - 'packages/shared/**'

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workers/worker
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # pinned-by-SHA + explicit bun-version skips the GitHub tags-API resolve that returns 401 (#221)
        with:
          bun-version: 1.1.42

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install shared package dependencies
        run: cd ../../packages/shared && bun install

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Deploy
        run: bunx wrangler deploy --minify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke test sync routes
        run: |
          check_status() {
            method="$1"
            path="$2"
            if [ "$method" = "POST" ]; then
              status="$(curl -sS -o /dev/null -w '%{http_code}' \
                -X "$method" "https://api.fidexa.org$path" \
                -H 'Content-Type: application/json' \
                -d '{}')"
            else
              status="$(curl -sS -o /dev/null -w '%{http_code}' \
                -X "$method" "https://api.fidexa.org$path")"
            fi

            if [ "$status" != "401" ]; then
              echo "Expected $method $path to return 401 without auth; got $status"
              exit 1
            fi
          }

          check_status POST /api/sync/push
          check_status POST /api/sync/upload-url
          check_status POST /api/sync/download-url
          check_status GET /api/sync/changes
          check_status GET /api/sync/conversations
