name: Anti-Steering + Entitlements

# IAP-08 / IAP-09: enforces App Review Guideline 3.1.1 (no external billing
# links / steering language) and Pitfall 10 (deprecated StoreKit-1 entitlement
# never reappears in rishi.entitlements) on every PR touching apps/apple/**.
#
# Two scripts run here:
#   1. apps/apple/scripts/check-anti-steering.sh
#        - --self-test  : proves the grep mechanics work (always green)
#        - (strict)     : fails on any forbidden pattern in Swift sources
#   2. apps/apple/scripts/check-entitlements-unchanged.sh
#        - fails if com.apple.developer.in-app-payments key returns
#
# Pure bash + grep, no Xcode/Swift toolchain — runs on ubuntu-latest.
#
# Strict mode is now UNCONDITIONAL (plan 13-05 Wave-3 capstone). The Phase-11
# legacy patterns that previously survived in the tree
# (BillingPortalService, /api/billing/portal, "Subscribe at", stripe.com)
# are all cleaned up:
#   * BillingPortalService + /api/billing/portal + stripe.com → removed by
#     plan 13-07 (Manage Subscription presenter rewrite).
#   * "Subscribe at" steering string in PaywallView → removed by plan 13-05
#     (paywall rewrite + neutralised fallback body).
# Any new violation slipped in by a future PR will fail this step.

on:
  pull_request:
    paths:
      - 'apps/apple/**'
      - '.github/workflows/apple-anti-steering.yml'
  push:
    branches: [main]
    paths:
      - 'apps/apple/**'
      - '.github/workflows/apple-anti-steering.yml'

permissions:
  contents: read

jobs:
  anti_steering:
    name: Anti-Steering + Entitlements
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Self-test the anti-steering script
        run: bash apps/apple/scripts/check-anti-steering.sh --self-test

      - name: Strict anti-steering scan
        run: bash apps/apple/scripts/check-anti-steering.sh

      - name: Entitlements unchanged
        run: bash apps/apple/scripts/check-entitlements-unchanged.sh
