name: Release Mac App Store

on:
  workflow_dispatch:

jobs:
  upload-mas:
    name: Build & Upload to App Store
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/main/src-tauri

      - name: Import certificates
        env:
          APPLE_DISTRIBUTION_CERT_P12: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12 }}
          APPLE_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          APPLE_INSTALLER_CERT_P12: ${{ secrets.APPLE_INSTALLER_CERT_P12 }}
          APPLE_INSTALLER_CERT_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          echo "$APPLE_DISTRIBUTION_CERT_P12" | base64 --decode > dist_cert.p12
          security import dist_cert.p12 -k build.keychain -P "$APPLE_DISTRIBUTION_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          rm dist_cert.p12

          echo "$APPLE_INSTALLER_CERT_P12" | base64 --decode > installer_cert.p12
          security import installer_cert.p12 -k build.keychain -P "$APPLE_INSTALLER_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          rm installer_cert.p12

          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v build.keychain

      - name: Install tauri-typegen
        run: cargo install tauri-typegen --version 0.3.2

      - name: Install dependencies
        run: |
          cd packages/shared && bun install
          cd ../../apps/main && bun install

      - name: Build Tauri app
        run: cd apps/main && bun run generate-types && npx tauri build --target universal-apple-darwin
        env:
          APPLE_SIGNING_IDENTITY: ""

      - name: Sign and package for Mac App Store
        env:
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          APP_PATH="apps/main/src-tauri/target/universal-apple-darwin/release/bundle/macos/rishi.app"
          ENTITLEMENTS="apps/main/src-tauri/Entitlements.mas.plist"

          echo "$APPLE_PROVISIONING_PROFILE" | base64 --decode > embedded.provisionprofile
          cp embedded.provisionprofile "$APP_PATH/Contents/embedded.provisionprofile"

          codesign --remove-signature "$APP_PATH" || true

          find "$APP_PATH/Contents/Frameworks" \( -type f -perm +111 -o -name "*.dylib" \) 2>/dev/null | while read f; do
            codesign --force --sign "Apple Distribution: Farid Matovu (9VL7VRY6QZ)" \
              --entitlements "$ENTITLEMENTS" "$f"
          done

          codesign --force --sign "Apple Distribution: Farid Matovu (9VL7VRY6QZ)" \
            --entitlements "$ENTITLEMENTS" \
            "$APP_PATH"

          codesign --verify --deep --strict "$APP_PATH"

          productbuild --component "$APP_PATH" /Applications \
            --sign "3rd Party Mac Developer Installer: Farid Matovu (9VL7VRY6QZ)" \
            rishi.pkg

      - name: Upload to App Store Connect
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p ~/.private_keys
          echo "$APPLE_API_KEY_P8" > "$HOME/.private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          xcrun altool --upload-app --type macos --file rishi.pkg \
            --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"

      - name: Cleanup
        if: always()
        run: |
          security default-keychain -s login.keychain-db
          security delete-keychain build.keychain || true
          rm -f embedded.provisionprofile rishi.pkg
          rm -rf ~/.private_keys
