"$schema" = "schemas/schema.json"

[default]
description = "Default permissions for the test-harness plugin — allows all commands."
permissions = [
  "allow-register-mock",
  "allow-clear-mocks",
  "allow-call-helper",
  "allow-get-app-state",
  "allow-resize-window",
  "allow-minimize-window",
  "allow-maximize-window",
  "allow-fullscreen-window",
  "allow-get-window-position",
  "allow-get-window-size",
]
